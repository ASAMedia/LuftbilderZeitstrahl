# Pull-and-run (Dockge, or any server with just this file):
#   1. (optional) copy .env.example -> .env to override IMAGE / HOST_PORT
#   2. docker compose pull
#   3. docker compose up -d
#
# This file is intentionally PULL-ONLY (no `build:`) — with a `build:` section,
# `docker compose up` tries to build from the stack folder, which in Dockge
# contains only this compose file (no Dockerfile/source) and fails. To build
# from a full checkout instead, add the override:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml build

services:
  app:
    # Image published by the GitHub Actions workflow (see .github/workflows).
    # Docker image refs MUST be lowercase: GitHub repo ASAMedia/LuftbilderZeitstrahl
    # → ghcr.io/asamedia/luftbilderzeitstrahl. Override via the IMAGE env if your
    # fork lives elsewhere.
    image: ${IMAGE:-ghcr.io/asamedia/luftbilderzeitstrahl:latest}
    restart: unless-stopped
    # Host port 3222 (3000 is taken on the target server); the container
    # itself still listens on 3000 inside its own network namespace.
    ports:
      - "${HOST_PORT:-3222}:3000"
    environment:
      PORT: "3000"
      CACHE_DIR: /data
      TZ: ${TZ:-Europe/Berlin}
      # Image-processing throttle (aerial frames). Defaults are conservative;
      # raise on a beefy box, lower if it still bites.
      SHARP_CONCURRENCY: ${SHARP_CONCURRENCY:-1}   # libvips threads per image
      PROC_CONCURRENCY: ${PROC_CONCURRENCY:-2}      # frames processed at once
      PREVIEW_MAX_PX: ${PREVIEW_MAX_PX:-3000}       # lower (e.g. 2200) = less CPU
    # Hard backstop so a processing burst can never starve the host, even
    # before this image update lands. docker compose v2 applies these on `up`.
    deploy:
      resources:
        limits:
          cpus: "${CPU_LIMIT:-2}"
          memory: ${MEM_LIMIT:-1g}
    volumes:
      - lz-cache:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  lz-cache:
