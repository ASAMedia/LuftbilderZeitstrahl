<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Luftbilder-Zeitstrahl · Thüringen</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div id="map"></div>

    <header id="topbar">
      <div class="title">
        <strong>Luftbilder-Zeitstrahl</strong>
        <span>Thüringen · historische Orthophotos &amp; Luftbilder, pro Zeitraum zusammengesetzt</span>
      </div>
      <div class="search">
        <input
          id="searchInput"
          type="text"
          placeholder="Ort suchen … (z. B. Weimar)"
          autocomplete="off"
          spellcheck="false"
        />
        <ul id="searchResults" class="hidden"></ul>
      </div>
      <div class="controls">
        <div class="seg" id="productToggle" role="group" aria-label="Bildtyp">
          <button data-type="op" class="active">Orthophotos</button>
          <button data-type="lb">Luftbilder</button>
        </div>
        <label class="opacity">
          Deckkraft
          <input id="opacity" type="range" min="0" max="1" step="0.05" value="1" />
        </label>
        <label class="chk" id="coverWrap" title="Nur die schärfsten Bilder, die die Fläche abdecken">
          <input type="checkbox" id="toggleCover" checked /> Beste Abdeckung
        </label>
        <label class="chk"><input type="checkbox" id="toggleOutlines" /> Kacheln</label>
        <label class="chk"><input type="checkbox" id="toggleCurrent" /> Aktuelles DOP</label>
      </div>
    </header>

    <div id="status" class="status hidden"></div>

    <aside id="spotlight" class="hidden" title="Schärfstes Bild für die Bildschirmmitte">
      <div class="spot-head">Schärfstes Bild · Mitte</div>
      <img id="spotImg" alt="Schärfstes Luftbild für die Bildschirmmitte" />
      <div class="spot-cap">
        <span id="spotMeta"></span>
        <a id="spotDl" href="#" target="_blank" rel="noopener">Original ↓</a>
      </div>
    </aside>

    <footer id="timeline">
      <button id="playBtn" class="play" title="Zeitraffer automatisch abspielen" aria-label="Zeitraffer abspielen">▶</button>
      <span class="divider" aria-hidden="true"></span>
      <button id="prevBtn" title="Früheres Jahr" aria-label="Früheres Jahr">❮</button>
      <input id="epochSlider" type="range" min="0" max="0" step="1" value="0" />
      <button id="nextBtn" title="Späteres Jahr" aria-label="Späteres Jahr">❯</button>
      <div class="epochLabel"><span id="epochLabel">–</span></div>
    </footer>

    <div id="attrib">
      Daten: © GDI-Th (Datenlizenz Deutschland – Namensnennung 2.0) ·
      <a href="https://geoportal.thueringen.de/gdi-th/download-offene-geodaten/download-luftbilder-und-orthophotos" target="_blank" rel="noopener">Quelle</a>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/leaflet-imageoverlay-rotated@0.2.1/Leaflet.ImageOverlay.Rotated.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
